# Upptime configuration for status.ohauthcat.com (handbook docs/24 §7).
# The checks stay paused until launch: the Uptime, Response Time, Graphs and
# Summary workflows are disabled and are switched on on go-live day.
owner: oh-auth-cat
repo: status

# One check per public component, on its production host. Outbound webhook
# delivery has no public endpoint to probe; webhook incidents are posted by
# hand as issues with the "webhooks" label.
sites:
  - name: Sign-in
    url: https://auth.ohauthcat.com/healthz
    slug: sign-in
  - name: Hosted sign-in pages
    url: https://signin.ohauthcat.com/
    slug: hosted-sign-in
  - name: SCIM
    url: https://scim.ohauthcat.com/healthz
    slug: scim
  - name: Management API
    url: https://api.ohauthcat.com/healthz
    slug: management-api
  - name: Dashboard
    url: https://console.ohauthcat.com/
    slug: dashboard
  - name: Setup portal
    url: https://connect.ohauthcat.com/
    slug: setup-portal

assignees:
  - koushikraj-s

status-website:
  cname: status.ohauthcat.com
  logoUrl: https://ohauthcat.com/apple-touch-icon.png
  favicon: https://ohauthcat.com/favicon.ico
  name: OhAuthCat status
  introTitle: "OhAuthCat status"
  introMessage: "Live status and uptime history of sign-in, SCIM, the management API, the dashboard and the setup portal. Incidents and post-mortems are posted here. Also at [oh-auth-cat.github.io/status](https://oh-auth-cat.github.io/status) if this domain does not resolve."
  navbar:
    - title: Status
      href: /
    - title: OhAuthCat
      href: https://ohauthcat.com
    - title: Incident history
      href: https://github.com/$OWNER/$REPO/issues?q=is%3Aissue
