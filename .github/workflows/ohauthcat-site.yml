# Publishes the OhAuthCat status page (site/) to GitHub Pages. Upptime keeps
# running the checks and writing history/ and issues; the page reads that data
# in the browser, so it only needs publishing when site/ changes. Upptime's
# own Static Site CI is disabled so it never overwrites gh-pages. The incident
# feed (feed.xml) is rebuilt on every publish, and an incident change publishes
# again so subscribers see it. snapshot.js (the last known status, drawn on
# first paint) is rebuilt on every publish and hourly, because Upptime's own
# commits carry [skip ci] and never trigger this workflow.
name: OhAuthCat status site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/ohauthcat-site.yml"
      - ".github/scripts/build-feed.mjs"
      - ".github/scripts/build-snapshot.mjs"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: ohauthcat-status-site
  cancel-in-progress: true
permissions:
  contents: write
  issues: read
jobs:
  publish:
    name: Publish status page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build the incident feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-feed.mjs site/feed.xml
      - name: Build the status snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-snapshot.mjs site/snapshot.js history
      - name: Add the custom domain
        run: echo "status.ohauthcat.com" > site/CNAME
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: "OhAuthCat status"
          user_email: "developers@ohauthcat.com"
          commit_message: "publish the status page"
